<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>Offer Stash</title><meta name="app-version" content="4.3"></head><body>
<header class="top"><div class="brandrow"><div><div class="brand">Offer Stash <span class="dot">•</span></div><div class="sub">Offers, warranties & things worth remembering</div></div><button id="backupBtn" class="round">⇅</button></div></header>
<nav class="nav"><button class="active" data-tab="stash">STASH <span id="stashCount" class="count">0</span></button><button data-tab="track">TRACK <span id="trackCount" class="count">0</span></button></nav>
<section id="stashPanel" class="panel"><div class="hero"><h2>Keep the useful stuff.</h2><p>Share an offer here, review the details, and save it locally.</p></div><div class="toolbar"><input id="searchStash" placeholder="Search offers…"><select id="categoryFilter"><option value="">All</option><option>Flight</option><option>Stay</option><option>Food</option><option>Grocery</option><option>Shopping</option><option>Rides</option><option>Fuel</option><option>Movies</option><option>Bills</option><option>Other</option></select></div><div id="stashList" class="list"></div><button id="addOffer" class="fab">＋</button></section>
<section id="trackPanel" class="panel hidden"><div class="hero"><h2>Never miss the next date.</h2><p>Service, warranty, subscription, renewal or anything you need to remember.</p></div><div class="toolbar"><input id="searchTrack" placeholder="Search tracker…"><select id="kindFilter"><option value="">All</option><option>Vehicle</option><option>Appliance</option><option>Warranty</option><option>Subscription</option><option>Health</option><option>Home</option><option>Electronics</option><option>Other</option></select></div><div id="trackList" class="list"></div><button id="addTrack" class="fab">＋</button></section>
<div id="modal" class="sheetwrap hidden"><div class="sheet"><div class="sheethead"><h2 id="modalTitle">Add Offer</h2><button id="closeModal" class="round">✕</button></div><div class="capture"><label>📷 Take photo<input id="cameraInput" type="file" accept="image/*" capture="environment"></label><label>🖼 Choose image<input id="imageInput" type="file" accept="image/*"></label><button id="pasteBtn">📋 Paste text</button></div><div id="preview" class="preview"></div><button id="smartBtn" class="smart">✨ Smart fill from text</button><form id="itemForm"><label>What is this?<input id="title" required></label><label id="sourceLabel">App / Site / Card<input id="source" placeholder="e.g. HDFC Bank, Amazon, Marriott"></label><label id="offerLabel">Offer text<textarea id="offerText" rows="3"></textarea></label><label id="codeLabel">Promo code<input id="code"></label><label>Valid till<input id="validTill" type="date"></label><label id="categoryLabel">Use it for<select id="category"><option>Flight</option><option>Stay</option><option>Food</option><option>Grocery</option><option>Shopping</option><option>Rides</option><option>Fuel</option><option>Movies</option><option>Bills</option><option>Other</option></select></label><label id="doneOnLabel" class="hidden">Done on<input id="doneOn" type="date"></label><label id="nextDateLabel" class="hidden">Next date (optional)<input id="nextDate" type="date"></label><label id="kindLabel" class="hidden">Kind<select id="kind"><option>Vehicle</option><option>Appliance</option><option>Warranty</option><option>Subscription</option><option>Health</option><option>Home</option><option>Electronics</option><option>Other</option></select></label><label>Notes / conditions<textarea id="notes" rows="3"></textarea></label><button id="saveBtn" class="primary" type="button">Save</button></form></div></div><div id="toast" class="toast"></div><script src="app.js?v=45"></script></body></html>
